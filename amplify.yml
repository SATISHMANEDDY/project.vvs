version: 1
applications:
  - appRoot: "vvs-portfolio-main/Desktop/portfolio vvs"
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*